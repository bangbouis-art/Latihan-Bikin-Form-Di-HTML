<!DOCTYPE html>
<html>
    <head>
        <title>Latihan Form</title>
    </head>
    <body>
        <form>
            <label for="nama lengkap">Nama Lengkap</label>
            <br>
            <input type="text" name="nama lengkap" id="nama lengkap" placeholder="Masukkan Nama Lengkap" required>
            <br>
            <label for="nim">NIM</label>
            <br>
            <input type="text" name="nim" id="nomer induk" placeholder="Masukkan Nim" required>
            <br>
            <label for="email">Email</label>
            <br>
            <input type="text" name="email" id="nama akun" placeholder="Masukkan Email" required>
            <br>
            <label for="jenis kelamin">Jenis Kelamin</label>
            <br>
            <input type="radio" name="jenis kelamin" id="pria"><label for="pria">Pria</label>
            <input type="radio" name="jenis kelamin" id="perempuan"><label for="perempuan">Perempuan</label>
            <br>
            <label for="program studi">Program Studi</label>
            <br>
            <select name="jurusan" id="program studi">
                <option value="teknik informatika">Teknik Informatika</option>
                <option value="sistem informasi">Sistem Informasi</option>
                <option value="manajemen informatika">Manajemen Informatika</option>
            </select>
            <br>
            <label for="alamat">Alamat</label>
            <br>
            <textarea name="alamat" id="rumah" cols="30" rows="10"></textarea>
            <br>
            <button type="submit">Submit</button>
        </form>
    </body>
</html>
